; ==============================================================================
; ⭐ PLATFORMIO CONFIGURATION — ARES 5-NODE TESTBED
; Configuração Exata: 1 Gateway, 1 Storage, 1 Router e 2 Relays
; ==============================================================================

[platformio]
default_envs = esp_router

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4

; ------------------------------------------------------------------------------
; 1. NÓ GATEWAY: Ingress conectado à Base Central via Wi-Fi / HTTP
; ------------------------------------------------------------------------------
[env:esp_gateway]
build_flags =
    -DNODE_ROLE=1
    -DNODE_ID='"ESP32_GATEWAY"'
    -DNODE_LAT='"-29.6994"'
    -DNODE_LON='"-53.6998"'
    -DNODE_ALTURA='"125m"'

; ------------------------------------------------------------------------------
; 2. NÓ ROUTER: Entrada de campo com Captive Portal SOS
; ------------------------------------------------------------------------------
[env:esp_router]
build_flags =
    -DNODE_ROLE=2
    -DNODE_ID='"ESP32_ROUTER"'
    -DNODE_LAT='"-29.7134"'
    -DNODE_LON='"-53.7158"'
    -DNODE_ALTURA='"105m"'

; ------------------------------------------------------------------------------
; 3. NÓ RELAY UNIVERSAL: Repetidor de malha (grave o mesmo código em N ESPs)
;    A identificação é 100% dinâmica baseada no MAC Address de cada placa
; ------------------------------------------------------------------------------
[env:esp_relay]
build_flags =
    -DNODE_ROLE=3

[env:esp_relay1]
build_flags =
    -DNODE_ROLE=3
    -DNODE_ID='"ESP32_RELAY_01"'
    -DNODE_LAT='"-29.7099"'
    -DNODE_LON='"-53.7118"'
    -DNODE_ALTURA='"110m"'

; ------------------------------------------------------------------------------
; 4. NÓ RELAY 2: Repetidor e retransmissão ad-hoc mesh
; ------------------------------------------------------------------------------
[env:esp_relay2]
build_flags =
    -DNODE_ROLE=3
    -DNODE_ID='"ESP32_RELAY_02"'
    -DNODE_LAT='"-29.7029"'
    -DNODE_LON='"-53.7038"'
    -DNODE_ALTURA='"120m"'

; ------------------------------------------------------------------------------
; 5. NÓ STORAGE: Custódia e Store-and-Forward persistente DTN
; ------------------------------------------------------------------------------
[env:esp_storage]
upload_speed = 115200
build_flags =
    -DNODE_ROLE=4
    -DNODE_ID='"ESP32_STORAGE"'
    -DNODE_LAT='"-29.7064"'
    -DNODE_LON='"-53.7078"'
    -DNODE_ALTURA='"115m"'

; ------------------------------------------------------------------------------
; 6. NÓ RELAY 3: Terceiro repetidor (para bancada com 6 nós: 1 GW, 1 Router, 1 Storage, 3 Relays)
; ------------------------------------------------------------------------------
[env:esp_relay3]
build_flags =
    -DNODE_ROLE=3
    -DNODE_ID='"ESP32_RELAY_03"'
    -DNODE_LAT='"-29.7045"'
    -DNODE_LON='"-53.7058"'
    -DNODE_ALTURA='"118m"'
