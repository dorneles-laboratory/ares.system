; ==============================================================================
; ⭐ PLATFORMIO CONFIGURATION — ARES UNIFIED MESH FIRMWARE
; ==============================================================================
; Código-fonte único universal para todos os nós ESP32 da malha ARES.
; O papel operacional (GATEWAY, ROUTER, RELAY, STORAGE) é definido dinamicamente
; em tempo de execução:
;   - Primeiro Gateway: segure o botão BOOT (GPIO 0) por 1s, pulso no GPIO 13
;                       ou digite 'role gateway' no monitor serial.
;   - Demais nós:       recebem suas funções via radiofrequência (ESP-NOW)
;                       diretamente pelo Dashboard ou auto-ajuste de bateria.
; ==============================================================================

[platformio]
default_envs = ares_node

[env:ares_node]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
build_flags =
    -DNODE_ROLE=3
